[package]
name = "rordle"
version = "0.1.0"
edition = "2021"
build = "src/build.rs"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.85"
slint = { version = "1.14.1" }
tracing = "0.1.40"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.8.5"
rayon = "1.10.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rand = "0.8.5"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[build-dependencies]
slint-build = "1.14.1"

[profile.release]
strip = true
codegen-units = 1
opt-level = 3
lto = true
panic = "abort"

[[bin]]
name = "game"
path = "src/play.rs"

[[bin]]
name = "solver"
path = "src/roget.rs"
