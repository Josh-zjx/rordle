name: Release WASM
run-name: Release ${{ inputs.version }} from CI run ${{ inputs.ci_run_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release tag, e.g. v0.1.0"
        required: true
        type: string
      ci_run_id:
        description: "Successful default-branch CI run ID (from its Actions URL)"
        required: true
        type: string

permissions:
  contents: read

# Serialize the whole publication so concurrent releases cannot lose Pages history.
concurrency:
  group: wasm-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and prepare the tested bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      ci_run_id: ${{ steps.candidate.outputs.run_id }}
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify successful CI and a new version
        id: candidate
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            const { default: prepare } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/prepare-release.cjs`);
            await prepare({ github, context, core });
      - name: Download the exact CI artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore previously published web releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          while IFS= read -r version; do
            gh release download "$version" --pattern rordle-web.zip --dir "history/$version"
          done < history-tags.txt
      - name: Verify bundle and assemble versioned Pages site
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          CI_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.tag }}
        run: |
          (cd candidate && sha256sum --check SHA256SUMS)
          python3 scripts/web_bundle.py pages \
            --bundle candidate/rordle-web.zip \
            --sha "$SOURCE_SHA" --run-id "$CI_RUN_ID" --version "$RELEASE_VERSION"
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Pass release downloads to the publisher
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            candidate/rordle-web.zip
            candidate/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish_release:
    name: Publish versioned GitHub Release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-files
      - name: Create or resume the draft release
        id: draft
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          CI_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
          PAGES_BASE_URL: ${{ needs.prepare.outputs.base_url }}
        with:
          script: |
            const tag = process.env.RELEASE_VERSION;
            const sha = process.env.SOURCE_SHA;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            let release = releases.find(candidate => candidate.tag_name === tag);
            if (release) {
              if (!release.draft || release.target_commitish !== sha) {
                throw new Error('An existing release cannot be replaced by this publication.');
              }
            } else {
              const base = process.env.PAGES_BASE_URL.replace(/\/$/, '');
              const body = [
                `Source commit: ${sha}`,
                `Tested CI run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.CI_RUN_ID}`,
                `Play this version: ${base}/releases/${tag}/`,
                `Latest approved version: ${base}/`,
                'Download rordle-web.zip to self-host the complete static game. SHA256SUMS verifies the archive.',
              ].join('\n\n');
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: sha,
                name: `Rordle ${tag}`, body, draft: true,
              })).data;
            }
            core.setOutput('id', String(release.id));
      - name: Upload the tested archive and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_VERSION" release-files/rordle-web.zip release-files/SHA256SUMS --clobber
      - name: Publish the completed release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: 'true',
            });

  deploy_pages:
    name: Serve the approved game on GitHub Pages
    needs: [prepare, publish_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summarize publication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "Latest approved game: ${PAGE_URL%/}/"
            echo ""
            echo "Pinned game URL: ${PAGE_URL%/}/releases/$RELEASE_VERSION/"
            echo ""
            echo "Release downloads: https://github.com/$GH_REPO/releases/tag/$RELEASE_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
