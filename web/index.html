<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rordle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1a1a1b;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 12px;
            box-sizing: border-box;
        }

        #app {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
        }

        canvas {
            display: block;
            outline: none;
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #787c7e;
        }

        footer {
            margin-top: 16px;
            font-size: 12px;
            color: #787c7e;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="loader">Loading…</div>
    <div id="app"></div>
    <footer>Rordle · Built with Rust + Slint · WebAssembly</footer>

    <script type="module">
        import init from "./pkg/rordle.js";

        const loader = document.getElementById("loader");
        init()
            .then(() => {
                loader.remove();
            })
            .catch((err) => {
                loader.textContent = "Failed to load: " + err;
                console.error(err);
            });
    </script>
</body>
</html>
